<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pencil Portraits — Travel with ION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400&family=Space+Grotesk:wght@300;400;500;700&family=Sora:wght@200;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000; --panel:#070310;
  --violet:#c873ff; --violet-2:#f0c0ff; --violet-dim:rgba(200,115,255,.45);
  --txt:#efe6ff;
  /* room geometry (px) */
  --room-w:1200px; --room-h:700px; --depth:11600px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--void);color:var(--txt);font-family:'Space Grotesk',sans-serif;overflow-x:hidden}
body{min-height:100vh}
img{display:block}
a{color:inherit;text-decoration:none}

/* ---------- scroll driver ---------- */
#scroller{position:relative;height:900vh;z-index:1;pointer-events:none}

/* ---------- fixed 3D stage ---------- */
.scene{position:fixed;inset:0;overflow:hidden;background:
   radial-gradient(120% 90% at 50% 18%,rgba(200,115,255,.10),transparent 55%),
   #000;
  perspective:1000px;perspective-origin:50% 50%;z-index:0}
.room{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.movers{position:absolute;left:0;top:0;transform-style:preserve-3d;transform:translateZ(0)}

.wall{position:absolute;left:0;top:0;transform-style:preserve-3d;
  background:linear-gradient(180deg,rgba(200,115,255,.035),transparent 16%,transparent 84%,rgba(200,115,255,.035));
  border:1px solid rgba(200,115,255,.20);
  box-shadow:inset 0 0 50px rgba(200,115,255,.05)}

/* ceiling = window into deep space (starfield + galaxies, black) */
.ceiling,.floor{position:absolute;left:0;top:0;width:var(--room-w);height:3800px;
  transform-style:preserve-3d;overflow:hidden}
.ceiling{transform:translate(-50%,-50%) translateZ(-1900px) translateY(calc(var(--room-h)/-2)) rotateX(-90deg);
  background:#000}
.ceiling .skyimg{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity 1.6s ease}
.ceiling .skyimg.on{opacity:1}
.ceiling .skyveil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.06) 32%, rgba(0,0,0,.55))}
/* floor = where the room's glow now lives */
.floor{transform:translate(-50%,-50%) translateZ(-1900px) translateY(calc(var(--room-h)/2)) rotateX(90deg);
  background:
    radial-gradient(75% 55% at 50% 22%, rgba(200,115,255,.24), transparent 72%),
    linear-gradient(180deg,#0a0410,#040209);
  box-shadow:inset 0 0 120px rgba(200,115,255,.16);
  animation:floorglow 6s ease-in-out infinite}
@keyframes floorglow{0%,100%{box-shadow:inset 0 0 90px rgba(200,115,255,.12)}50%{box-shadow:inset 0 0 165px rgba(200,115,255,.28)}}

/* forward-walk button (mobile) */
#fwd{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:42;width:60px;height:60px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;color:var(--violet-2);
  background:radial-gradient(circle,rgba(34,14,52,.9),rgba(8,3,14,.75));
  border:1px solid rgba(200,115,255,.6);box-shadow:0 0 22px rgba(200,115,255,.5),inset 0 0 14px rgba(200,115,255,.22);
  animation:fwdpulse 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent;touch-action:none}
#fwd svg{width:27px;height:27px}
#fwd:active{transform:translateX(-50%) scale(.9)}
#fwd.hide{opacity:0;pointer-events:none}
@keyframes fwdpulse{0%,100%{box-shadow:0 0 16px rgba(200,115,255,.4),inset 0 0 10px rgba(200,115,255,.2)}
  50%{box-shadow:0 0 32px rgba(200,115,255,.7),inset 0 0 16px rgba(200,115,255,.34)}}
.wall.left{width:var(--depth);height:var(--room-h);
  transform:translate(-50%,-50%) translateZ(calc(var(--depth)/-2)) translateX(calc(var(--room-w)/-2)) rotateY(90deg)}
.wall.right{width:var(--depth);height:var(--room-h);
  transform:translate(-50%,-50%) translateZ(calc(var(--depth)/-2)) translateX(calc(var(--room-w)/2)) rotateY(-90deg)}
.wall.back{width:var(--room-w);height:var(--room-h);
  transform:translate(-50%,-50%) translateZ(-2600px)}
/* static wall skins carry the surface (bg/border/waves); moving "ghost" walls carry only the art */
.wall.ghost{background:none;border:none;box-shadow:none}
.wall.left.skin{width:3800px;transform:translate(-50%,-50%) translateZ(-1900px) translateX(calc(var(--room-w)/-2)) rotateY(90deg)}
.wall.right.skin{width:3800px;transform:translate(-50%,-50%) translateZ(-1900px) translateX(calc(var(--room-w)/2)) rotateY(-90deg)}
.wall.back .bk-title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font-family:'Sora',sans-serif;font-weight:200;letter-spacing:.4em;font-size:34px;color:rgba(240,192,255,.30);text-transform:uppercase;z-index:2}
.wall canvas.waves{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
@media (pointer:coarse){.wall canvas.waves{display:none}}

/* drawings hung on the side walls */
.art{position:absolute;cursor:pointer;transform:translateZ(12px);
  transition:filter .35s ease}
.art .frame{padding:14px;background:#060209;
  border:1px solid rgba(200,115,255,.5);
  box-shadow:0 0 18px rgba(200,115,255,.35), inset 0 0 10px rgba(200,115,255,.12);
  transition:box-shadow .35s ease, transform .35s ease}
.art .frame .mat{padding:8px;background:#0b0712;box-shadow:inset 0 0 0 1px rgba(200,115,255,.18)}
.art img{width:100%;height:auto}
.art .plate{margin-top:9px;text-align:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:300;
  letter-spacing:.16em;text-transform:uppercase;font-size:10px;color:rgba(240,192,255,.6)}
.art:hover .frame{box-shadow:0 0 30px rgba(200,115,255,.6), inset 0 0 14px rgba(200,115,255,.2);transform:translateZ(8px) scale(1.015)}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:16px 26px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);pointer-events:auto}
.nav .brand{display:flex;align-items:center;gap:12px}
.nav .brand .mark{width:34px;height:34px;border-radius:50%;border:1px solid var(--violet-dim);
  box-shadow:0 0 14px rgba(200,115,255,.4);display:grid;place-items:center;font-family:'Sora';font-weight:800;color:var(--violet-2);font-size:15px;background:#0a0612}
.nav .brand b{font-family:'Sora',sans-serif;font-weight:600;letter-spacing:.18em;font-size:13px;text-transform:uppercase}
.nav .brand span{display:block;font-weight:300;font-size:10px;letter-spacing:.22em;color:rgba(240,192,255,.55);text-transform:uppercase}
.nav .links{display:flex;gap:20px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:300}
.nav .links a{opacity:.7;transition:opacity .25s,text-shadow .25s}
.nav .links a:hover{opacity:1;text-shadow:0 0 10px var(--violet)}
.nav .links a.here{opacity:1;color:var(--violet-2);text-shadow:0 0 12px var(--violet)}
@media(max-width:640px){.nav .links{gap:13px;font-size:10px}.nav .brand span{display:none}}

/* ---------- hero / intro card ---------- */
/* floating sign in space — flat to the camera so it stays readable, hovering low off the floor */
.skysign{position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) translateZ(-950px) translateY(235px);
  pointer-events:none;transition:opacity .3s linear}
.signpanel{width:780px;text-align:center;animation:floatsign 6.5s ease-in-out infinite}
@keyframes floatsign{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.signpanel .kick{font-family:'Plus Jakarta Sans',sans-serif;font-weight:200;letter-spacing:.5em;text-transform:uppercase;
  font-size:18px;color:var(--violet-2);text-shadow:0 0 16px rgba(200,115,255,.7);padding-left:.5em}
.signpanel .title{margin-top:12px;font-family:'Sora',sans-serif;font-weight:800;font-size:82px;line-height:1;
  letter-spacing:.03em;background:linear-gradient(180deg,#fff,var(--violet-2) 55%,var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(200,115,255,.6))}
.signpanel .instruction{margin-top:20px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;
  letter-spacing:.02em;text-transform:none;font-size:34px;color:#fff;text-shadow:0 1px 2px #000, 0 0 18px rgba(200,115,255,.55)}

/* ---------- enlarged viewer (lifts off wall) ---------- */
#backdrop{position:fixed;inset:0;z-index:48;background:radial-gradient(circle at 50% 45%,rgba(20,6,32,.72),rgba(0,0,0,.92));
  opacity:0;visibility:hidden;transition:opacity .45s ease, visibility .45s}
#backdrop.on{opacity:1;visibility:visible}
#viewer{position:fixed;inset:0;z-index:50;pointer-events:none}
#vfig{position:fixed;left:0;top:0;width:0;height:0;pointer-events:auto;cursor:pointer;
  background:#060209;padding:18px;border:1px solid rgba(200,115,255,.6);
  box-shadow:0 0 60px rgba(200,115,255,.5), inset 0 0 16px rgba(200,115,255,.2);
  opacity:0;visibility:hidden;
  transition:left .6s cubic-bezier(.22,.61,.36,1),top .6s cubic-bezier(.22,.61,.36,1),width .6s cubic-bezier(.22,.61,.36,1),height .6s cubic-bezier(.22,.61,.36,1),opacity .3s ease, transform .6s cubic-bezier(.22,.61,.36,1)}
#vfig.on{opacity:1;visibility:visible}
#vfig .mat{width:100%;height:100%;padding:10px;background:#0b0712;box-shadow:inset 0 0 0 1px rgba(200,115,255,.2);display:flex;align-items:center;justify-content:center}
#vimg{max-width:100%;max-height:100%;width:auto;height:auto}
#vcap{position:fixed;left:0;right:0;bottom:5vh;z-index:51;text-align:center;opacity:0;transition:opacity .4s ease .25s;pointer-events:none}
#vcap.on{opacity:1}
#vcap b{display:block;font-family:'Sora';font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:15px;color:var(--violet-2);text-shadow:0 0 14px rgba(200,115,255,.6)}
#vcap small{display:block;margin-top:6px;font-weight:300;letter-spacing:.24em;text-transform:uppercase;font-size:10px;color:rgba(239,230,255,.6)}
#vcap em{display:block;margin-top:10px;font-style:normal;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(240,192,255,.45)}

/* ---------- mobile 2D gallery (touch devices only) ---------- */
#m2d{display:none}
body.touch #m2d{display:block}
body.touch .scene,body.touch #scroller,body.touch #fwd{display:none!important}
body.touch{overflow-y:auto}
.m2d-hero{position:relative;padding:92px 22px 30px;text-align:center;
  background:linear-gradient(180deg,rgba(4,2,10,.5),rgba(4,2,10,.9)),#000 url("assets/galaxies/ceiling.jpg") center/cover}
.m2d-kick{font-family:'Plus Jakarta Sans',sans-serif;font-weight:200;letter-spacing:.4em;text-transform:uppercase;font-size:12px;color:var(--violet-2)}
.m2d-title{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(34px,11vw,60px);line-height:1;margin-top:8px;
  background:linear-gradient(180deg,#fff,var(--violet-2) 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(200,115,255,.5))}
.m2d-sub{margin-top:12px;font-weight:400;color:#fff;font-size:17px;line-height:1.5;text-shadow:0 1px 2px #000,0 0 14px rgba(200,115,255,.45)}
.m2d-grid{display:grid;grid-template-columns:1fr;gap:18px;padding:22px 16px 64px;background:#04020a}
@media (min-width:560px){.m2d-grid{grid-template-columns:1fr 1fr}}
.m2d-card{cursor:pointer;-webkit-tap-highlight-color:transparent}
.m2d-frame{padding:10px;background:#070310;border:1px solid rgba(200,115,255,.45);
  box-shadow:0 0 16px rgba(200,115,255,.25);border-radius:4px}
.m2d-frame img{width:100%;height:auto;display:block;border-radius:2px}
.m2d-plate{margin-top:9px;text-align:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;font-size:15px;color:#fff;text-shadow:0 1px 2px #000,0 0 12px rgba(200,115,255,.5)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(2,1,8,.96);display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:78vh;border:1px solid rgba(200,115,255,.6);box-shadow:0 0 40px rgba(200,115,255,.4)}
#lbcap{margin-top:14px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  font-size:17px;color:#fff;text-align:center;text-shadow:0 1px 2px #000,0 0 14px rgba(200,115,255,.55)}
</style>

    {f:"nude-on-black-paper",        t:"Nude on Black Paper",    m:"On black paper",    side:"L"},
    {f:"peter-black-and-white",      t:"Peter in Black & White", m:"Graphite on paper", side:"R"},
    {f:"red-sheer",                  t:"Red Sheer",              m:"Colored pencil",    side:"L"},
    {f:"richard-and-son-christerpher", t:"Richard & Son Christopher", m:"Graphite on paper", side:"R"},
    {f:"shane-and-chris",            t:"Shane & Chris",          m:"Graphite on paper", side:"L"},
    {f:"southern-bell",              t:"Southern Belle",         m:"Graphite on paper", side:"R"},
    {f:"tear-ceramic-tile",          t:"Tear",                   m:"Ceramic tile",      side:"L"},
    {f:"thong",                      t:"Thong",                  m:"Figure study",      side:"R"},
    {f:"times-of-our-lives",         t:"Times of Our Lives",     m:"Graphite on paper", side:"L"},
    {f:"tinas-legs",                 t:"Tina's Legs",            m:"Graphite on paper", side:"R"},
    {f:"tracy-by-the-pool",          t:"Tracy by the Pool",      m:"Graphite on paper", side:"L"},
    {f:"tracys-hot-legs",            t:"Tracy's Hot Legs",       m:"Graphite on paper", side:"R"},
    {f:"vahn-harper-and-wife",       t:"Vahn Harper & Wife",     m:"Graphite on paper", side:"L"},
    {f:"waterfall",                  t:"Waterfall",              m:"Graphite on paper", side:"R"},
    {f:"wedding-couple",             t:"Wedding Couple",         m:"Graphite on paper", side:"L"},
    {f:"young-woman-on-brown-paper", t:"Young Woman on Brown Paper", m:"On brown paper", side:"R"}
  ];

  // ---------- touch devices: build a lightweight 2D gallery and skip the 3D engine entirely ----------
  if (TOUCH) {
    document.body.classList.add("touch");
    var grid = document.getElementById("m2dGrid");
    var lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg"), lbcap = document.getElementById("lbcap");
    PIECES.forEach(function(p){
      var card = document.createElement("div");
      card.className = "m2d-card";
      card.innerHTML =
        '<div class="m2d-frame"><img src="assets/art/' + p.f + '.jpg" alt="' + p.t + '" loading="lazy"></div>' +
        '<div class="m2d-plate">' + p.t + '</div>';
      card.addEventListener("click", function(){
        lbimg.src = "assets/art/" + p.f + ".jpg";
        lbcap.textContent = p.t + " \u00b7 " + p.m;
        lb.classList.add("on");
      });
      grid.appendChild(card);
    });
    lb.addEventListener("click", function(){ lb.classList.remove("on"); });
    return;
  }

  var wallL = document.getElementById("wallL");
  var wallR = document.getElementById("wallR");
  var movers = document.getElementById("movers");
  var sign  = document.getElementById("sign");
  var fwd   = document.getElementById("fwd");
  var arts  = [];
  var WALL_LEN = 11600, BACKDIST = 2600, EMERGE = 520;   // back wall sits a fixed distance ahead; art fades in as it emerges

  // auto-placement along each wall: staggered heights + widths so nothing lines up flat
  var THEIGHTS = [110, 290, 165, 250, 130, 300, 205, 175];
  var WIDTHS   = [300, 250, 275, 215, 295, 235, 260];
  var START_L = 300, START_R = 420, SPACING = 250;
  var iL = 0, iR = 0;

  PIECES.forEach(function(p, gi){
    var el = document.createElement("div");
    el.className = "art";
    var depth, hi;
    if (p.side === "L"){ depth = START_L + iL*SPACING; hi = iL; iL++; }
    else               { depth = START_R + iR*SPACING; hi = iR; iR++; }
    // the right wall's local x-axis runs opposite to the left's — mirror so depth means the same on both
    el.style.left  = (p.side === "L" ? depth : WALL_LEN - depth) + "px";
    el.style.top   = THEIGHTS[hi % THEIGHTS.length] + "px";
    el.style.width = WIDTHS[gi % WIDTHS.length] + "px";
    el.dataset.title  = p.t;
    el.dataset.medium = p.m;
    el.dataset.basez  = -depth;   // base world-Z (before camera) on its wall
    el.innerHTML =
      '<div class="frame"><div class="mat"><img src="assets/art/'+p.f+'.jpg" alt="'+p.t+'" loading="lazy"></div></div>'+
      '<div class="plate">'+p.t+'</div>';
    (p.side === "L" ? wallL : wallR).appendChild(el);
    el.addEventListener("click", function(e){ e.stopPropagation(); open(el); });
    arts.push(el);
  });

  // ---------- scroll → camera walk ----------
  var CAM_MAX = 11000;         // px walked into the room
  var cam = 0, target = 0, raf = null;
  function maxScroll(){ return Math.max(1, document.getElementById("scroller").offsetHeight - window.innerHeight); }
  function onScroll(){
    if (viewerOpen) return;
    var pr = Math.min(1, Math.max(0, window.scrollY / maxScroll()));
    target = pr * CAM_MAX;
    // fade the back-wall signage as you approach it
    sign.style.opacity = Math.max(0, 1 - pr*4);   // sign is static now — fade out quickly as the walk starts
    loop();
  }
  function loop(){
    if (raf) return;
    raf = requestAnimationFrame(step);
  }
  function step(){
    raf = null;
    cam += (target - cam) * 0.2;
    if (Math.abs(target - cam) < 0.4) cam = target;
    movers.style.transform = "translateZ(" + cam + "px)";  // ONLY the side walls move
    for (var i=0;i<arts.length;i++){
      var a = arts[i];
      var eff = parseFloat(a.dataset.basez) + cam;   // world z relative to camera
      var op;
      if (eff < -BACKDIST)  op = Math.max(0, 1 - (-BACKDIST - eff)/EMERGE); // emerging from the far wall
      else if (eff > -120)  op = Math.max(0, 1 - (eff + 120)/240);         // passing the camera
      else                  op = 1;
      op = Math.round(op * 100) / 100;
      if (a._op !== op){                              // only touch the DOM when it actually changes
        a.style.opacity = op;
        var vis = op === 0 ? "hidden" : "visible";    // fully-faded frames stop being composited
        if (a._vis !== vis){ a.style.visibility = vis; a._vis = vis; }
        var pe = op < 0.5 ? "none" : "auto";
        if (a._pe !== pe){ a.style.pointerEvents = pe; a._pe = pe; }
        a._op = op;
      }
    }
    if (cam !== target) loop();
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", onScroll);

  // ---------- enlarged viewer (FLIP: lift off wall → float in front) ----------
  var backdrop = document.getElementById("backdrop");
  var vfig = document.getElementById("vfig");
  var vimg = document.getElementById("vimg");
  var vcap = document.getElementById("vcap");
  var viewerOpen = false, current = null;

  function frameRect(el){
    return el.querySelector(".frame").getBoundingClientRect();
  }
  function setBox(r){
    vfig.style.left = r.left + "px";
    vfig.style.top  = r.top  + "px";
    vfig.style.width  = r.width  + "px";
    vfig.style.height = r.height + "px";
  }
  function targetBox(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var maxW = vw * 0.82, maxH = vh * 0.78;
    var ar = (vimg.naturalWidth && vimg.naturalHeight) ? vimg.naturalWidth/vimg.naturalHeight : 0.8;
    // figure has 18px pad + mat 10px pad => ~56px chrome total
    var pad = 56;
    var w = maxW, h = (w - pad)/ar + pad;
    if (h > maxH){ h = maxH; w = (h - pad)*ar + pad; }
    return { left:(vw - w)/2, top:(vh - h)/2, width:w, height:h };
  }
  function open(el){
    if (viewerOpen) return;
    viewerOpen = true; current = el;
    if (fwd) fwd.classList.add("hide");
    var start = frameRect(el);
    vimg.src = el.querySelector("img").src;
    // place exactly over the wall piece (flat to screen)
    vfig.style.transition = "none";
    setBox(start);
    vfig.classList.add("on");
    backdrop.classList.add("on");
    // caption
    vcap.querySelector("b").textContent = el.dataset.title;
    vcap.querySelector("small").textContent = el.dataset.medium;
    var go = function(){
      vfig.style.transition = "";
      var t = targetBox();
      setBox(t);
      vcap.classList.add("on");
    };
    if (vimg.complete && vimg.naturalWidth){ requestAnimationFrame(function(){ requestAnimationFrame(go); }); }
    else { vimg.onload = function(){ requestAnimationFrame(function(){ requestAnimationFrame(go); }); }; }
  }
  function close(){
    if (!viewerOpen || !current) return;
    if (fwd) fwd.classList.remove("hide");
    var back = frameRect(current);
    vcap.classList.remove("on");
    backdrop.classList.remove("on");
    setBox(back);
    var done = function(){
      vfig.classList.remove("on");
      vfig.removeEventListener("transitionend", done);
    };
    vfig.addEventListener("transitionend", done);
    viewerOpen = false; current = null;
  }
  vfig.addEventListener("click", function(e){ e.stopPropagation(); close(); });
  backdrop.addEventListener("click", close);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") close(); });
  // block walking while a piece is held in front
  window.addEventListener("wheel",  function(e){ if (viewerOpen) e.preventDefault(); }, {passive:false});
  window.addEventListener("touchmove", function(e){ if (viewerOpen) e.preventDefault(); }, {passive:false});

  // ---------- wave fields on the walls (flow from the horizon toward you) ----------
  var waveCanvases = [];
  Array.prototype.forEach.call(document.querySelectorAll("canvas.waves"), function(cv){
    var len = parseInt(cv.dataset.len, 10) || 1500;
    var iw  = Math.min(1300, Math.round(len / 3)); // cap internal res — huge canvases choke the GPU
    cv.width  = iw;                    // CSS stretches to full wall
    cv.height = 234;                   // ~ room height / 3
    waveCanvases.push({ cv:cv, ctx:cv.getContext("2d"), fx:(len/3)/iw });
  });
  var LINES = [
    {col:"rgba(200,115,255,0.85)", amp:0.10, freq:0.9, speed:1.7, off:0.0,  base:0.50, lw:2},
    {col:"rgba(240,192,255,0.70)", amp:0.07, freq:1.4, speed:2.3, off:1.1,  base:0.42, lw:1.5},
    {col:"rgba(160,90,235,0.50)",  amp:0.13, freq:0.6, speed:1.2, off:2.2,  base:0.62, lw:2.5},
    {col:"rgba(255,255,255,0.55)", amp:0.05, freq:1.9, speed:2.8, off:3.3,  base:0.34, lw:1}
  ];
  function drawWaves(o, t){
    var ctx = o.ctx, W = o.cv.width, H = o.cv.height, FX = o.fx || 1;
    ctx.clearRect(0,0,W,H);
    for (var i=0;i<LINES.length;i++){
      var L = LINES[i];
      ctx.beginPath();
      ctx.lineWidth = L.lw;
      ctx.strokeStyle = L.col;
      var baseY = H * L.base, amp = H * L.amp;
      for (var x=0; x<=W; x+=6){
        // +t makes crests travel toward x=0 = the front edge (toward the viewer)
        var y = baseY + amp * Math.sin(x*0.012*L.freq*FX + t*L.speed + L.off)
                      + amp*0.35 * Math.sin(x*0.03*L.freq*FX - t*L.speed*0.6);
        if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }
  if (!TOUCH) {
    var wt = 0, last = performance.now();
    (function waveLoop(now){
      var dt = Math.min(0.05, (now - last)/1000); last = now;
      wt += dt;
      for (var i=0;i<waveCanvases.length;i++) drawWaves(waveCanvases[i], wt);
      requestAnimationFrame(waveLoop);
    })(last);
  }

  // ---------- forward-walk button (mobile) ----------
  var holding = false;
  function advance(){ if (!holding) return; window.scrollBy(0, 30); requestAnimationFrame(advance); }
  if (fwd){
    fwd.addEventListener("pointerdown", function(e){ e.preventDefault(); holding = true; advance(); });
    ["pointerup","pointercancel","pointerleave"].forEach(function(ev){ fwd.addEventListener(ev, function(){ holding = false; }); });
    window.addEventListener("pointerup", function(){ holding = false; });
  }

  // ---------- ceiling slideshow (lazy: at most 2 images loaded; single static image on phones) ----------
  (function(){
    var urls = ["ceiling.jpg","ceiling2.jpg","ceiling3.jpg","ceiling4.jpg","ceiling5.jpg","ceiling6.jpg","ceiling7.jpg"]
                 .map(function(f){ return "assets/galaxies/" + f; });
    var layers = document.querySelectorAll(".ceiling .skyimg");
    if (!layers.length) return;
    var a = layers[0], b = layers[1] || null;
    a.style.backgroundImage = "url('" + urls[0] + "')"; a.classList.add("on");
    if (PHONE || !b) return;                 // phones: one static image, no rotation
    var idx = 0, front = a;
    setInterval(function(){
      var next = (idx + 1) % urls.length;
      var back = (front === a) ? b : a;
      var pre = new Image();
      pre.onload = function(){
        back.style.backgroundImage = "url('" + urls[next] + "')";
        back.classList.add("on");
        front.classList.remove("on");
        front = back; idx = next;
      };
      pre.src = urls[next];
    }, 30000);
  })();

  onScroll();
})();
</script>
</body>
</html>
